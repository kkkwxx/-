# 20 条信源种子（03-信源管理 §5.1 清单总表）
# 落库口径：app.seed 按 code upsert，已存在的源只补缺失字段，不覆盖人改过的配置（03 §10.2）
# expected_status_on_first_run 只用于 `python -m app.seed --verify` 对账，不参与运行逻辑。
# Google News 源的 url 是 §5.3 基础模板拼好的完整地址，query_template 存未编码的 QUERY 原文。

# ---------------- S1 正常源（A 级 rss）----------------
- code: nasa_breaking
  name: NASA Breaking News
  type: rss
  level: A
  url: https://www.nasa.gov/news-release/feed/
  query_template: null
  poll_interval_min: 30
  enabled: true
  expected_domains: [nasa.gov]
  title_suffix_rules: ["- NASA", "| NASA"]
  api_key_env: null
  note: 需求点名源；实测 200 / 10 条
  expected_status_on_first_run: ok

