# Alembic config. ASCII only: on Windows alembic reads this file with the
# locale codec (gbk), so any non-ASCII byte here breaks startup.
# The connection URL is injected by alembic/env.py from app.core.config.settings,
# which is why sqlalchemy.url below stays empty.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# version files are hand numbered (0001_initial.py), no timestamp prefix
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

# ---------------------------------------------------------------------------
# Logging: keep it minimal and routed to stderr.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
