[project]
name = "mystery-news-backend"
version = "0.1.0"
description = "神秘新闻 MVP 后端：信源管理 + 采集 + 事件判定 + AI 加工 + 审核 + 发布"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.28",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=6.0",
    "apscheduler>=3.10,<4",
    "tenacity>=9.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "python-json-logger>=2.0",
    "pyyaml>=6.0.2",
    "openai>=3.60.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "faker>=40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
